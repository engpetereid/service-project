server:
  port: ${PORT:8080}

spring:
  application:
    name: service-project

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/church_service?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"


app:
  time-zone: ${APP_TIMEZONE:Africa/Cairo}
  week-start: FRIDAY
  week-lock-days: 30
  weekly-reminder-hours: 24

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

admin:
  phone: ${ADMIN_PHONE:}
  password: ${ADMIN_PASSWORD:}
